# ============================================================
# Multi-Agent-Local-Workspace 配置文件
# 所有路径均锁定 D 盘，禁止写入 C 盘
# ============================================================

project:
  name: "Multi-Agent-Local-Workspace"
  version: "1.0.0"
  root_dir: "D:/AI/Multi-Agent-Local-Workspace"
  python_version: "3.10"
  # ⚠️ Python 3.14 存在依赖兼容问题（langgraph / gradio / chromadb 等暂未完全适配），不推荐使用

# ------------------------------------------------------------
# LLM 后端配置
# 默认：Ollama 本地模型（零 token 费用）
# 备用：OpenAI 兼容云端 API
# ------------------------------------------------------------
llm:
  default_backend: "ollama"  # 可选: ollama / openai

  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b-instruct"
    temperature: 0.7
    top_p: 0.9
    max_tokens: 4096
    num_ctx: 8192
    # 拉取模型命令: ollama pull qwen2.5-7b-instruct

  openai:
    # 备用云端模式，需自行配置 API Key
    # 支持任意 OpenAI 兼容端点（DeepSeek / 通义千问 / OpenAI 等）
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 4096

# ------------------------------------------------------------
# 路径配置（全部锁定 D 盘项目目录内）
# ------------------------------------------------------------
paths:
  output_dir: "D:/AI/Multi-Agent-Local-Workspace/output"
  logs_dir: "D:/AI/Multi-Agent-Local-Workspace/logs"
  vector_store_dir: "D:/AI/Multi-Agent-Local-Workspace/vector_store"
  data_dir: "D:/AI/Multi-Agent-Local-Workspace/data"
  venv_dir: "D:/AI/Multi-Agent-Local-Workspace/venv"

# ------------------------------------------------------------
# CodeAgent 沙盒配置
# 仅允许读写 output 目录，拦截 C 盘与系统目录
# ------------------------------------------------------------
sandbox:
  allowed_root: "D:/AI/Multi-Agent-Local-Workspace/output"
  blocked_drives:
    - "C:"
  blocked_paths:
    - "C:/Windows"
    - "C:/Program Files"
    - "C:/Program Files (x86)"
    - "C:/Users"
    - "C:/ProgramData"
    - "/etc"
    - "/usr"
    - "/var"
    - "/root"
    - "/home"
  max_file_size_mb: 50
  allowed_extensions:
    - ".py"
    - ".txt"
    - ".md"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".csv"
    - ".xml"
    - ".html"
    - ".css"
    - ".js"
    - ".ts"
    - ".jsx"
    - ".tsx"
    - ".java"
    - ".c"
    - ".cpp"
    - ".h"
    - ".go"
    - ".rs"
    - ".sh"
    - ".bat"
    - ".log"
    - ".toml"
    - ".ini"
    - ".cfg"

# ------------------------------------------------------------
# Agent 角色配置
# ------------------------------------------------------------
agents:
  planner:
    name: "PlannerAgent"
    role: "任务规划与拆解"
    max_iterations: 3

  code:
    name: "CodeAgent"
    role: "代码生成与沙盒执行"
    max_iterations: 5
    enable_sandbox: true

  doc:
    name: "DocAgent"
    role: "文档生成与整理"
    max_iterations: 3

  review:
    name: "ReviewAgent"
    role: "安全审核与质量检查"
    max_iterations: 3
    security_check: true
    quality_check: true

# ------------------------------------------------------------
# 向量库配置（本地 Chroma，数据存 D 盘）
# ------------------------------------------------------------
vector_store:
  provider: "chroma"
  persist_directory: "D:/AI/Multi-Agent-Local-Workspace/vector_store"
  embedding_model: "nomic-embed-text"  # ollama pull nomic-embed-text
  collection_name: "workspace_knowledge"

# ------------------------------------------------------------
# WebUI (Gradio) 配置
# ------------------------------------------------------------
webui:
  host: "127.0.0.1"
  port: 7860
  theme: "soft"
  title: "Multi-Agent Local Workspace"
  share: false  # 设为 true 可生成公网临时链接

# ------------------------------------------------------------
# 日志配置
# ------------------------------------------------------------
logging:
  level: "INFO"
  file: "D:/AI/Multi-Agent-Local-Workspace/logs/workspace.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
